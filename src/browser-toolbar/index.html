<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>浏览器导航</title><link rel="stylesheet" href="style.css"></head>
<body><nav aria-label="浏览器导航"><button id="back" aria-label="后退" title="后退（Alt+←）" disabled><img src="icons/arrow_back.svg" alt=""></button><button id="forward" aria-label="前进" title="前进（Alt+→）" disabled><img src="icons/arrow_forward.svg" alt=""></button><button id="reload" aria-label="重新加载" title="重新加载"><img src="icons/refresh.svg" alt=""></button><button id="home" aria-label="返回主页" title="返回主页"><img src="icons/home.svg" alt=""></button><form id="location"><img class="search-icon" src="icons/search.svg" alt=""><label for="address" class="sr-only">当前网址或 Google 搜索关键词</label><input id="address" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="8192" placeholder="在 Google 中搜索，或输入网址" aria-describedby="message"></form></nav><p id="message" role="status" hidden></p><script src="renderer.js"></script></body></html>
