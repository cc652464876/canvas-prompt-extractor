<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>浏览器导航</title><link rel="stylesheet" href="vendor/chrome-tabs/chrome-tabs.css"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="tabstrip">
  <button id="tab-search" title="搜索标签页" aria-label="搜索标签页"><img src="icons/expand_more.svg" alt=""></button>
  <div id="tabs" class="chrome-tabs" role="tablist" aria-label="浏览器标签页"><div class="chrome-tabs-content"></div><div class="chrome-tabs-bottom-bar"></div></div>
  <button id="new-tab" title="新建标签页（Ctrl+T）" aria-label="新建标签页"><img src="icons/add.svg" alt=""></button>
  <div class="window-drag"></div><div class="native-controls-space" aria-hidden="true"></div>
</header>
<nav aria-label="浏览器导航"><button id="back" aria-label="后退" title="后退（Alt+←）" disabled><img src="icons/arrow_back.svg" alt=""></button><button id="forward" aria-label="前进" title="前进（Alt+→）" disabled><img src="icons/arrow_forward.svg" alt=""></button><button id="reload" aria-label="重新加载" title="重新加载（Ctrl+R）"><img src="icons/refresh.svg" alt=""></button><button id="home" aria-label="返回主页" title="返回主页（Alt+Home）"><img src="icons/home.svg" alt=""></button><form id="location"><img class="search-icon" src="icons/search.svg" alt=""><label for="address" class="sr-only">当前网址或 Google 搜索关键词</label><input id="address" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="8192" placeholder="在 Google 中搜索，或输入网址" aria-describedby="message"></form></nav>
<p id="message" role="status" hidden></p><script src="vendor/draggabilly/draggabilly.pkgd.js"></script><script src="vendor/chrome-tabs/chrome-tabs.js"></script><script src="renderer.js"></script></body></html>
